<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a hospital problem</title>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
<header>
  <button type="button" id="exit" aria-label="Hide this chat: clears it and leaves this page">Hide this chat ✕</button>
  <h1>Report a hospital problem</h1>
  <p>Private. No name needed. Run by {{ pack.org_name }}.</p>
</header>
<main id="log" aria-live="polite"></main>
<form id="form" autocomplete="off">
  {% if voice %}<button type="button" id="mic" aria-label="Record a voice note" aria-pressed="false">🎤</button>{% endif %}
  <textarea id="text" rows="2" placeholder="Tell me what happened…" aria-label="Your message" required></textarea>
  <button type="submit">Send</button>
</form>
<footer>
  <button type="button" class="link" id="new">Start a new report</button>
  <button type="button" class="link" id="check">Check a report with my code</button>
  {% if demo_mode %}<details><summary class="link">Demo</summary>
  <button type="button" class="link" id="nextday">Simulate next day</button>
  {% for p in packs %}{% if p.id != pack.id %}<a class="link" href="/?pack={{ p.id }}">Switch to {{ p.title }}</a>{% endif %}{% endfor %}</details>{% endif %}
</footer>
<script>window.PACK = {{ pack.id|tojson }}; window.OFFLINE = {{ pack.message("E.unavailable")|tojson }};</script>
<script src="/static/chat.js?v={{ asset_v }}" defer></script>
{% if voice %}<script>window.VOICE_NOTE = {{ pack.message("S0.voice")|tojson }};</script>
<script src="/static/voice.js?v={{ asset_v }}" defer></script>{% endif %}
</body>
</html>
